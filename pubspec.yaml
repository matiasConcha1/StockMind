name: stockmind
description: Professional Flutter inventory management dashboard with Firebase authentication and low-stock alerts.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.1.3
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  go_router: ^17.2.3
  pdf: ^3.11.3
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/images/
    - assets/screenshots/

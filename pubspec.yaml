name: stockmind
description: StockMind is a Flutter Web + Firebase inventory management SaaS with smart alerts, analytics and responsive dashboard.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  barcode_widget: ^2.0.4
  cloud_firestore: ^6.1.3
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  firebase_messaging: ^16.2.0
  firebase_storage: ^13.0.3
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  go_router: ^17.2.3
  pdf: ^3.11.3
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  mobile_scanner: ^7.1.2
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/screenshots/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"

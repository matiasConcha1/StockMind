name: stockmind
description: Dashboard profesional para gestión de inventario y alertas de stock.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.4
  go_router: ^17.2.3
  google_fonts: ^6.3.2
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="StockMind, sistema moderno de gestion de inventario."
    />
    <meta name="theme-color" content="#1D4ED8" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockMind" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <title>StockMind</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family:
          "Inter",
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background:
          radial-gradient(circle at top right, rgba(124, 58, 237, 0.34), transparent 28%),
          radial-gradient(circle at bottom left, rgba(37, 99, 235, 0.28), transparent 24%),
          linear-gradient(135deg, #07111f 0%, #0f1c34 42%, #1d4ed8 72%, #7c3aed 100%);
      }

      #stockmind-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 9999;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      #stockmind-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-shell {
        width: min(100%, 520px);
        padding: 36px 32px;
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 28px 52px -18px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        text-align: center;
        color: #fff;
        transform: translateY(10px) scale(0.985);
        opacity: 0;
        animation: loader-enter 0.45s ease forwards;
      }

      .loader-logo {
        width: 100px;
        height: 100px;
        margin: 0 auto;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .loader-logo img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        transform: scale(1.92);
        transform-origin: center;
      }

      .loader-logo-fallback {
        display: none;
        width: 68px;
        height: 68px;
        border-radius: 22px;
        background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        color: #ffffff;
        font-size: 42px;
        line-height: 1;
        font-weight: 700;
        align-items: center;
        justify-content: center;
      }

      .loader-title {
        margin: 22px 0 8px;
        font-size: clamp(32px, 4vw, 38px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .loader-subtitle,
      .loader-status,
      .loader-fallback {
        margin: 0;
        color: rgba(255, 255, 255, 0.82);
      }

      .loader-subtitle {
        font-size: 16px;
      }

      .loader-spinner {
        width: 26px;
        height: 26px;
        margin: 24px auto 20px;
        border-radius: 50%;
        border: 2.6px solid rgba(255, 255, 255, 0.22);
        border-top-color: rgba(255, 255, 255, 0.92);
        animation: spin 0.95s linear infinite;
      }

      .loader-status {
        min-height: 22px;
        font-size: 15px;
        transition: opacity 0.2s ease;
      }

      .loader-progress {
        position: relative;
        width: 100%;
        height: 5px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .loader-progress::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: rgba(255, 255, 255, 0.9);
        animation: progress-slide 1.35s ease-in-out infinite;
      }

      .loader-fallback-wrap {
        display: none;
        margin-top: 24px;
      }

      .loader-fallback-wrap.is-visible {
        display: block;
      }

      .loader-fallback {
        margin-bottom: 14px;
        color: rgba(255, 255, 255, 0.86);
      }

      .loader-button {
        border: 0;
        border-radius: 16px;
        padding: 12px 18px;
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      @keyframes loader-enter {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes progress-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      @media (max-width: 640px) {
        .loader-shell {
          padding: 30px 22px;
          border-radius: 28px;
        }

        .loader-title {
          margin-top: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div id="stockmind-loader" aria-live="polite">
      <div class="loader-shell">
        <div class="loader-logo" aria-hidden="true">
          <img id="loader-logo-image" src="icons/Icon-192.png" alt="StockMind" />
          <div class="loader-logo-fallback" id="loader-logo-fallback">📦</div>
        </div>
        <h1 class="loader-title">StockMind</h1>
        <p class="loader-subtitle">Preparando tu inventario...</p>
        <div class="loader-spinner" aria-hidden="true"></div>
        <p class="loader-status" id="loader-status">Verificando sesion...</p>
        <div class="loader-progress" aria-hidden="true"></div>
        <div class="loader-fallback-wrap" id="loader-fallback">
          <p class="loader-fallback">Esto esta tardando mas de lo normal</p>
          <button class="loader-button" type="button" onclick="window.location.reload()">
            Reintentar
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const statusEl = document.getElementById("loader-status");
        const fallbackEl = document.getElementById("loader-fallback");
        const loaderEl = document.getElementById("stockmind-loader");
        const logoFallbackEl = document.getElementById("loader-logo-fallback");
        const logoImgEl = document.getElementById("loader-logo-image");
        const messages = [
          "Verificando sesion...",
          "Conectando con Firebase...",
          "Preparando tu inventario...",
        ];

        if (logoImgEl && logoFallbackEl) {
          logoImgEl.addEventListener("error", function () {
            logoImgEl.style.display = "none";
            logoFallbackEl.style.display = "flex";
          });
        }

        let messageIndex = 0;
        const messageTimer = window.setInterval(() => {
          messageIndex = (messageIndex + 1) % messages.length;
          if (statusEl) {
            statusEl.textContent = messages[messageIndex];
          }
        }, 2000);

        const fallbackTimer = window.setTimeout(() => {
          if (fallbackEl) {
            fallbackEl.classList.add("is-visible");
          }
        }, 8000);

        function hideLoader() {
          window.clearInterval(messageTimer);
          window.clearTimeout(fallbackTimer);
          if (loaderEl) {
            loaderEl.classList.add("is-hidden");
            window.setTimeout(() => loaderEl.remove(), 380);
          }
        }

        window.addEventListener("flutter-first-frame", hideLoader);

        let deferredInstallPrompt = null;
        let flutterServiceWorkerRegistration = null;
        let updateReady = false;

        function emitPwaEvent(name) {
          window.dispatchEvent(new CustomEvent(name));
        }

        function emitPwaState() {
          emitPwaEvent("stockmind-pwa-state");
        }

        function setupFlutterServiceWorker(registration) {
          flutterServiceWorkerRegistration = registration;

          function attachWaitingWorker(worker) {
            if (!worker) return;
            updateReady = true;
            emitPwaEvent("stockmind-pwa-update-available");
          }

          if (registration.waiting) {
            attachWaitingWorker(registration.waiting);
          }

          registration.addEventListener("updatefound", function () {
            const newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener("statechange", function () {
              if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                attachWaitingWorker(newWorker);
              }
            });
          });

          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (!updateReady) return;
            updateReady = false;
            window.location.reload();
          });

          window.setInterval(function () {
            registration.update().catch(function (error) {
              console.debug("Flutter SW update check failed", error);
            });
          }, 60000);
        }

        window.addEventListener("beforeinstallprompt", function (event) {
          event.preventDefault();
          deferredInstallPrompt = event;
          emitPwaEvent("stockmind-pwa-installable");
          emitPwaState();
        });

        window.addEventListener("appinstalled", function () {
          deferredInstallPrompt = null;
          emitPwaEvent("stockmind-pwa-installed");
          emitPwaState();
        });

        window.addEventListener("stockmind-request-install", async function () {
          if (!deferredInstallPrompt) return;
          deferredInstallPrompt.prompt();
          try {
            await deferredInstallPrompt.userChoice;
          } catch (error) {
            console.debug("Install prompt dismissed", error);
          }
        });

        window.addEventListener("stockmind-request-update", function () {
          const waitingWorker = flutterServiceWorkerRegistration?.waiting;
          if (!waitingWorker) {
            window.location.reload();
            return;
          }
          waitingWorker.postMessage({ type: "SKIP_WAITING" });
        });

        window.addEventListener("stockmind-pwa-state-request", function () {
          emitPwaState();
          if (deferredInstallPrompt) {
            emitPwaEvent("stockmind-pwa-installable");
          }
          if (flutterServiceWorkerRegistration?.waiting) {
            emitPwaEvent("stockmind-pwa-update-available");
          }
        });

        if ("serviceWorker" in navigator) {
          window.addEventListener("flutter-first-frame", function () {
            navigator.serviceWorker
              .register("flutter_service_worker.js")
              .then(setupFlutterServiceWorker)
              .catch(function (error) {
                console.error("Flutter service worker registration failed", error);
              });
          });
        }
      })();
    </script>
    <script src="main.dart.js" type="application/javascript"></script>
  </body>
</html>
